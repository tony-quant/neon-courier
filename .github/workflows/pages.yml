# Test, then publish the game to GitHub Pages. Runs on pushes to the platformer branch that change a game file, and on manual start.
# Documentation-only pushes (CLAUDE.md, README.md) do not start a run.
# A failing test stops the workflow before anything is uploaded or deployed.
name: pages

on:
  push:
    branches: [platformer]
    paths:
      - index.html
      - css/**
      - js/**
      - levels/**
      - icons/**
      - manifest.webmanifest
      - sw.js
      - package.json
      - package-lock.json
      - tools/build.js
      - tests/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the artifact (only the files the game serves)
        run: |
          node tools/build.js
          rm -rf _site && mkdir _site
          cp -r index.html css js levels icons manifest.webmanifest sw.js _site/
          find _site -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
